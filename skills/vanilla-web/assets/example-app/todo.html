<title>Todos · Acme</title>
<meta name="description" content="Your todo list, stored in this browser.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1b4332">
<link rel="stylesheet" href="/js/components/todo-list/todo-list.css">
<link rel="modulepreload" href="/js/components/todo-list/todo-list.js">
<link rel="modulepreload" href="/js/components/todo-list/TodoList.js">

<body>
<!-- verbatim:header -->
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="/">Acme</a>
  <nav aria-label="Primary">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/todo.html" aria-current="page">Todos</a></li>
      <li><a href="/profile.html">Profile</a></li>
    </ul>
  </nav>
</header>
<!-- /verbatim:header -->
<main id="main">
  <h1>Todos</h1>
  <todo-list>
    <form class="todo-form" action="/todo.html" method="get">
      <label for="new-todo">New todo</label>
      <input id="new-todo" name="title" required pattern=".*\S.*" maxlength="200" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p class="todo-status" role="status" data-status></p>
    <ul class="todo-items" data-items></ul>
    <template data-item>
      <li>
        <todo-item>
          <label><input type="checkbox" name="done"> <span data-title>Todo</span></label>
          <button type="button" data-remove>Remove <span class="visually-hidden" data-title></span></button>
        </todo-item>
      </li>
    </template>
  </todo-list>
</main>
<!-- verbatim:footer -->
<footer class="site-footer">
  <p>Acme example app. No framework, no build step.</p>
</footer>
<!-- /verbatim:footer -->
</body>
</html>
